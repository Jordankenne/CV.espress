<!doctype html>
<html lang="{{ langue }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}{% endblock %} · MonCVexpress.com</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <link rel="canonical" href="{{ url_page }}">
  {%- for code, _, _, adresse in versions %}
  <link rel="alternate" hreflang="{{ code }}" href="{{ adresse }}">
  {%- endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ versions[0][3] }}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ self.titre() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ url_page }}">
  <meta property="og:image" content="{{ image_partage }}">
  {% block tete %}{% endblock %}
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/img/icone-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/img/icone-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#f4efe6">
  <link rel="preload" href="/polices/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page-texte">

<header class="entete entete-page">
  <a href="{{ p }}/" class="logo">MonCVexpress<span>.com</span></a>
  <nav class="entete-actions" aria-label="{{ c.acces }}">
    {% include "_langues.html" %}
    <a href="{{ p }}/compte" class="bouton" data-lien-compte>{{ c.connexion }}</a>
    <a href="{{ p }}/creer" class="bouton principal">{{ c.creer }}</a>
  </nav>
</header>

<main class="article">
{% block contenu %}{% endblock %}
</main>

{% include "_pied.html" %}
<script src="/traductions.js"></script>
<script src="/entete.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
