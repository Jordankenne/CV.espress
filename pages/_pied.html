<footer class="pied">
  <div class="pied-haut">
    <span class="logo">MonCVexpress<span>.com</span></span>
    <span>{{ c.pied }}</span>
    {%- if don_lien %}
    <a class="bouton soutenir" href="{{ don_lien }}" target="_blank" rel="noopener">{{ c.soutenir }}</a>
    {%- endif %}
  </div>
  <nav class="pied-liens" aria-label="{{ c.pied_nav }}">
    {%- for adresse, libelle in c.liens %}
    <a href="{{ p }}/{{ adresse }}">{{ libelle }}</a>
    {%- endfor %}
  </nav>
  <div class="pied-bas">
    {% include "_langues.html" %}
    <p class="signature">© {{ annee }} MonCVexpress.com · {{ c.signature }} <strong translate="no">TKJ.DEV</strong></p>
  </div>
</footer>
