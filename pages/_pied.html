<footer class="pied">
  <div class="pied-haut">
    <span class="logo">CV<span>.</span>express</span>
    <span>{{ c.pied }}</span>
  </div>
  <nav class="pied-liens" aria-label="{{ c.pied_nav }}">
    {%- for adresse, libelle in c.liens %}
    <a href="{{ p }}/{{ adresse }}">{{ libelle }}</a>
    {%- endfor %}
  </nav>
  <div class="pied-bas">
    {% include "_langues.html" %}
    <p class="signature">© {{ annee }} CV.express · {{ c.signature }} <strong translate="no">TKJ.DEV</strong></p>
  </div>
</footer>
