# Déploiement GRATUIT sur Render (https://render.com) : New > Blueprint > choisir ce dépôt.
# Les valeurs marquées sync: false sont demandées par Render lors de la création.
#
# L'offre gratuite n'a pas de disque : les comptes vont dans une base PostgreSQL en ligne
# (Neon, gratuite), et les e-mails partent par l'API de Brevo (le SMTP y est bloqué).
# Le site s'endort après 15 minutes sans visite (premier chargement lent ensuite).
# Pour passer à l'offre payante plus tard : plan: starter (plus rapide, jamais endormi),
# et retirer les quatre réglages « petite machine » plus bas.
services:
  - type: web
    name: cv-express
    runtime: docker
    plan: free
    region: frankfurt        # choisir la même région pour la base Neon (AWS Europe Central / Frankfurt)
    healthCheckPath: /sante    # réponse immédiate, sans base de données
    envVars:
      - key: DERRIERE_PROXY
        value: "1"
      - key: CLE_SECRETE
        generateValue: true  # chaîne aléatoire créée une fois par Render
      - key: ADRESSE_SITE    # ex. https://cv-express.onrender.com, ou ton propre domaine
        sync: false
      - key: DATABASE_URL    # chaîne de connexion Neon : postgresql://…?sslmode=require
        sync: false
      - key: BREVO_CLE_API   # Brevo > SMTP & API > API Keys
        sync: false
      - key: ADMINS          # adresse(s) des comptes administrateurs (page /admin), séparées par des virgules
        sync: false
      - key: EMAIL_EXPEDITEUR  # adresse validée dans Brevo, ex. CV.express <ton.adresse@gmail.com>
        sync: false
      - key: IA_FOURNISSEUR      # facultatif : groq, cerebras ou anthropic (vide : assistant IA désactivé)
        sync: false
      - key: GROQ_API_KEY        # si IA_FOURNISSEUR=groq : console.groq.com > API Keys
        sync: false
      - key: ANTHROPIC_API_KEY   # si IA_FOURNISSEUR=anthropic : platform.claude.com > API Keys
        sync: false
      - key: IA_ANALYSES_PAR_JOUR  # analyses par compte et par jour (5 par défaut)
        sync: false
      - key: TURNSTILE_CLE_SITE  # facultatif : Cloudflare > Turnstile > Site Key (anti-robot de l'inscription)
        sync: false
      - key: TURNSTILE_SECRET    # facultatif : Cloudflare > Turnstile > Secret Key
        sync: false
      # Petite machine (0,1 processeur, 512 Mo) : une compilation à la fois, plus de temps.
      - key: COMPILATIONS_SIMULTANEES
        value: "1"
      - key: DUREE_COMPILATION_MAX
        value: "45"
      - key: DELAI_SERVEUR
        value: "180"
      - key: MEMOIRE_PROCESSUS_MO
        value: "400"
