# Tests automatiques à chaque envoi sur GitHub et à chaque pull request.
# Deux passages : base SQLite (comme en développement) et base PostgreSQL jetable (comme Neon
# en production). Les tests n'utilisent jamais la vraie base : aucun secret n'est nécessaire.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        base: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cv_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: LaTeX et poppler (mêmes paquets que le Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures lmodern tex-gyre \
            texlive-luatex fonts-dejavu-core fonts-dejavu-extra poppler-utils
      - name: Dépendances Python
        run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          CV_TESTS_POSTGRES: ${{ matrix.base == 'postgres' && 'postgresql://test:test@localhost:5432/cv_tests' || '' }}
        run: python -m pytest tests -q

  # Le site dans un vrai navigateur, comme un visiteur : remplir un CV, aperçu, inscription au
  # moment de télécharger, PDF, Word, « Mon espace » ; puis chaque page à 5 largeurs d'écran
  # (débordements, erreurs JavaScript, fichiers introuvables, accessibilité de base).
  navigateur:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: LaTeX et poppler (mêmes paquets que le Dockerfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures lmodern tex-gyre \
            texlive-luatex fonts-dejavu-core fonts-dejavu-extra poppler-utils
      - name: Dépendances Python
        run: pip install -r requirements.txt
      - name: Site en local, base jetable
        run: |
          DOSSIER_DONNEES="$RUNNER_TEMP/donnees" nohup python -c "import app; app.app.run(port=5077, threaded=True)" \
            > "$RUNNER_TEMP/serveur.log" 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:5077/sante && break; sleep 1; done
      - name: Parcours et pages dans Chrome
        run: node tests/navigateur/verifier.mjs http://127.0.0.1:5077 "$(command -v google-chrome || command -v chromium)"
      - name: Journal du serveur (en cas d'échec)
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/serveur.log"
